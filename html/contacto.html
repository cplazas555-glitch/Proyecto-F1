
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Portal F1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Menú -->
    <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="img/Logo-F1.png" alt="Logo F1" height="50">
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pilotos.html">Pilotos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="escuderias.html">Escuderías</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="automoviles.html">Monoplazas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page"
                            href="contacto.html">Contacto</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Contacto -->
    <section id="contacto">
        <div class="container py-5">

            <h2 class="text-center mb-3">Contáctanos</h2>

            <p class="text-center mb-4">
                ¿Tienes alguna pregunta sobre la Fórmula 1?
                Escríbenos.
            </p>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre completo
                            </label>

                            <input type="text" class="form-control"
                                id="nombre" name="nombre"
                                placeholder="Escribe tu nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email" class="form-control"
                                id="correo" name="correo"
                                placeholder="nombre@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label">
                                Asunto
                            </label>

                            <select class="form-select" id="asunto"
                                name="asunto" required>
                                <option value="" selected disabled>
                                    Selecciona un asunto
                                </option>
                                <option>Información sobre pilotos</option>
                                <option>Información sobre escuderías</option>
                                <option>Información sobre monoplazas</option>
                                <option>Opinión o sugerencia</option>
                                <option>Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">
                                Mensaje
                            </label>

                            <textarea class="form-control" id="mensaje"
                                name="mensaje" rows="4"
                                placeholder="Escribe tu mensaje aquí..."
                                required></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-danger">
                                Enviar mensaje
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-1">
                © 2026 Portal F1. Todos los derechos reservados.
            </p>
            <p class="mb-0">Carlos Plazas</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
